[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-tutor-backend"
version = "0.1.0"
description = "FastAPI class library, server-owned Live session, and calculator service for Screen Tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1.0",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1.0",
  "google-genai>=2.25,<3.0",
  "httpx>=0.27,<1.0",
  "Pillow>=12.0,<13.0",
  "pypdf>=5.3,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "python-pptx>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sympy>=1.14,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["services/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
